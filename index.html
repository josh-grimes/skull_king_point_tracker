<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skull King</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rock+Salt&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Screen 1: Game Mode Selection (Visible by default) -->
    <section id="game-mode">
      <h1>Skull King</h1>
      <h2>Select Game Mode:</h2>
      <div id="mode-select">
        <button>Normal</button>
        <button>Odd Only</button>
        <button>Even Only</button>
      </div>
    </section>

    <!-- Screen 2: Player Setup Screen -->
    <section id="setup-screen" class="hidden">
      <div id="num_players">
        <label for="rowCount">Number of Players</label>
        <input type="number" id="rowCount" value="3" min="2" max="8" />
      </div>

      <table id="dynamicTable">
        <tbody></tbody>
      </table>
      <div class="btn-container">
        <button id="start-btn">Start Game</button>
      </div>
    </section>

    <!-- Screen 3: Gameplay / Rounds Screen -->
    <section id="rounds" class="hidden">
      <h2 id="round-title">Round 1</h2>

      <!-- JavaScript will dynamically insert player scorecards here -->
      <div id="players-container"></div>

      <div class="btn-container">
        <button type="submit" id="submit-round-btn">Submit Round</button>
      </div>
    </section>
  </body>
</html>
