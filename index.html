<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Skull King</title>

    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/screens.css" />
    <link rel="stylesheet" href="assets/css/modal.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&display=swap" rel="stylesheet" />

    <script src="js/state.js" defer></script>
    <script src="js/modal.js" defer></script>
    <script src="js/scoring.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <!-- MAIN MENU SCREEN -->
    <section id="game-mode">
      <h1>Skull King</h1>
      <h2>Select Game Mode:</h2>
      <div id="mode-select">
        <button class="btn">
          <span class="top-line">Normal</span>
          <span class="bottom-line">10 rounds in ascending order</span>
        </button>
        <button class="btn">
          <span class="top-line">Even Keeled</span>
          <span class="bottom-line">5 rounds (2, 4, 6, 8, & 10 cards)</span>
        </button>
        <button class="btn">
          <span class="top-line">Skip to the Brawl</span>
          <span class="bottom-line">5 rounds (6, 7, 8, 9, & 10 cards)</span>
        </button>
        <button class="btn">
          <span class="top-line">Swift-n-Salty Skirmish</span>
          <span class="bottom-line">5 rounds (5 cards every round)</span>
        </button>
        <button class="btn">
          <span class="top-line">Broadside Barrage</span>
          <span class="bottom-line">10 rounds (10 cards every round)</span>
        </button>
        <button class="btn">
          <span class="top-line">Whirlpool</span>
          <span class="bottom-line">10 rounds (Two sets of rounds going down: 9, 7, 5, 3, 1)</span>
        </button>
        <button class="btn">
          <span class="top-line">Past Your Bedtime</span>
          <span class="bottom-line">1 round (1 card... followed by a goodnight hug)</span>
        </button>
      </div>
    </section>

    <!-- SETUP SCREEN -->
    <section id="setup-screen" class="hidden">
      <header class="header-nav">
        <button class="back-menu-btn">← Main Menu</button>
      </header>

      <div id="num_players">
        <label for="rowCount">Number of Players</label>
        <input type="number" id="rowCount" value="3" min="2" max="8" inputmode="numeric" />
      </div>

      <table id="dynamicTable">
        <tbody></tbody>
      </table>
      <h2>Advanced:</h2>
      <div id="togglable">
        <div id="expansion">
          <label>Expansion Pack</label>
          <label class="switch">
            <input type="checkbox" />
            <span class="slider round"></span>
          </label>
        </div>
        <div id="rascel-scoring">
          <label>Rascel of Roatan Scoring</label>
          <label class="switch">
            <input type="checkbox" />
            <span class="slider round"></span>
          </label>
        </div>
        <div id="grimes-family">
          <label>Grimes Family Scoring</label>
          <label class="switch">
            <input type="checkbox" />
            <span class="slider round"></span>
          </label>
        </div>
      </div>
      <div class="btn-container">
        <button id="start-btn">Start Game</button>
      </div>
    </section>

    <!-- ROUNDS SCREEN -->
    <section id="rounds" class="hidden">
  <header class="header-nav">
    <button class="back-menu-btn">← Main Menu</button>
    <button class="prev-round-btn" id="prev-round-btn">Previous Round</button>
  </header>
  
  <h2 id="round-title-heading">Round 1 of 10</h2>
  <div id="cards-dealt-subtitle" class="cards-dealt-subtitle">(1 Card)</div>

  <div id="players-container"></div>

  <div class="btn-container">
    <button type="submit" id="submit-round-btn">Submit Round</button>
  </div>
</section>
  </body>
</html>
